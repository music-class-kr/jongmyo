<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>종묘제례악 수업 자료</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Serif+KR:wght@300;400;600;700;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Noto Serif KR',serif;
  background: linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px 20px;
}
.wrap{
  width:100%;
  max-width:650px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:22px;
}
.main-title{
  color:#f0e6d3;
  font-family:'Nanum Myeongjo',serif;
  font-size:34pt;
  font-weight:800;
  letter-spacing:8px;
  text-align:center;
  text-shadow:0 2px 12px rgba(0,0,0,0.5);
  margin-bottom:6px;
}
.sub-title{
  color:#c9a96e;
  font-size:13pt;
  letter-spacing:3px;
  text-align:center;
  margin-top:-14px;
  margin-bottom:6px;
}
.section-label{
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  color:rgba(255,255,255,0.45);
  font-size:11pt;
  letter-spacing:2px;
}
.section-label::before,
.section-label::after{
  content:'';
  flex:1;
  height:1px;
  background:rgba(255,255,255,0.2);
}
.btn-ppt{
  width:100%;
  background: linear-gradient(135deg,#c9a96e,#e8c97e,#c9a96e);
  border:none;
  border-radius:18px;
  padding:44px 20px;
  cursor:pointer;
  text-decoration:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
  box-shadow:0 8px 32px rgba(201,169,110,0.4);
  transition:transform 0.2s, box-shadow 0.2s;
}
.btn-ppt:hover{
  transform:translateY(-4px);
  box-shadow:0 14px 40px rgba(201,169,110,0.6);
}
.btn-ppt .icon{font-size:52pt;}
.btn-ppt .label{
  font-family:'Nanum Myeongjo',serif;
  font-size:26pt;
  font-weight:800;
  color:#1a1a2e;
  letter-spacing:5px;
}
.btn-ppt .desc{
  font-size:13pt;
  color:#3a3a2e;
  letter-spacing:1px;
}
.row{
  width:100%;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}
.btn-mid{
  background:rgba(255,255,255,0.10);
  border:2px solid rgba(255,255,255,0.30);
  border-radius:14px;
  padding:28px 10px;
  cursor:pointer;
  text-decoration:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  transition:transform 0.2s, background 0.2s;
}
.btn-mid:hover{
  transform:translateY(-3px);
  background:rgba(255,255,255,0.18);
}
.btn-mid .icon{font-size:32pt;}
.btn-mid .label{
  font-family:'Nanum Myeongjo',serif;
  font-size:16pt;
  font-weight:700;
  color:#f0e6d3;
  letter-spacing:2px;
  text-align:center;
}
.btn-mid .desc{
  font-size:10.5pt;
  color:#bbb;
  letter-spacing:0.5px;
  text-align:center;
}
.btn-hwp{
  background:rgba(100,180,255,0.08);
  border:2px solid rgba(100,180,255,0.30);
  border-radius:14px;
  padding:26px 10px;
  cursor:pointer;
  text-decoration:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  transition:transform 0.2s, background 0.2s;
}
.btn-hwp:hover{
  transform:translateY(-3px);
  background:rgba(100,180,255,0.16);
}
.btn-hwp .icon{font-size:30pt;}
.btn-hwp .label{
  font-family:'Nanum Myeongjo',serif;
  font-size:15pt;
  font-weight:700;
  color:#a8d8ff;
  letter-spacing:2px;
  text-align:center;
}
.btn-hwp .desc{
  font-size:10pt;
  color:#88aacc;
  letter-spacing:0.5px;
  text-align:center;
}
</style>
</head>
<body>
<div class="wrap">

  <div class="main-title">종묘제례악</div>
  <div class="sub-title">宗廟祭禮樂 · 수업 자료</div>

  <!-- PPT -->
  <div class="section-label">📊 수업 PPT</div>
  <a href="종묘제례악 PPT.html" class="btn-ppt">
    <span class="icon">📊</span>
    <span class="label">수업 PPT 열기</span>
    <span class="desc">클릭하면 바로 열립니다</span>
  </a>

  <!-- 활동지 & 답안 -->
  <div class="section-label">📋 활동지</div>
  <div class="row">
    <a href="종묘제례악 활동지.html" class="btn-mid">
      <span class="icon">📋</span>
      <span class="label">활동지</span>
      <span class="desc">학생용</span>
    </a>
    <a href="종묘제례악 활동지 답지.html" class="btn-mid">
      <span class="icon">✅</span>
      <span class="label">활동지 답안</span>
      <span class="desc">교사용 정답지</span>
    </a>
  </div>

  <!-- HWP 다운로드 -->
  <div class="section-label">⬇ HWP 다운로드</div>
  <div class="row">
    <a href="종묘제례악 배치판.hwpx" download class="btn-hwp">
      <span class="icon">⬇</span>
      <span class="label">배치판</span>
      <span class="desc">HWP 다운로드</span>
    </a>
    <a href="종묘제례악 악기들.hwpx" download class="btn-hwp">
      <span class="icon">⬇</span>
      <span class="label">악기들</span>
      <span class="desc">HWP 다운로드</span>
    </a>
  </div>

</div>
</body>
</html>
